[package]
name = "claude-tunnel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fail-closed, dedicated WireGuard tunnels for Claude Code"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
ksni = { version = "0.3", features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
